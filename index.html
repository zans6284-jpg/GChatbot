<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Chat Web</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bg-container">
  <video id="bgVideo" autoplay loop muted></video>
  <img id="bgImage">
</div>

<div class="app">

<header>
  <button id="menuBtn">☰</button>
  <h2>Gemini Chat</h2>
  <button id="settingBtn">⚙</button>
</header>

<div id="chat"></div>

<div class="input-box">
  <input
    id="message"
    placeholder="Tulis pesan..."
  >
  <button id="sendBtn">
    Send
  </button>
</div>

</div>

<div id="floatingMenu" class="hidden">
  <button id="editMsg">
    Edit
  </button>

  <button id="copyMsg">
    Salin
  </button>

  <button id="deleteMsg">
    Hapus
  </button>
</div>

<div id="settings" class="hidden">

<h3>Pengaturan AI</h3>

<input
id="apikey"
placeholder="Gemini API Key">

<select id="model">
<option>gemini-2.5-flash</option>
<option>gemini-2.5-pro</option>
<option>gemini-2.0-flash</option>
</select>

<input id="temp" type="number" step="0.1" value="1">

<input id="topP" type="number" step="0.1" value="0.9">

<input id="topK" type="number" value="40">

<input
id="prompt"
placeholder="System Prompt">

<h3>Background</h3>

<input
type="file"
id="bgFile"
accept="image/*,video/*">

<button id="saveBg">
Save Background
</button>

<button id="muteBg">
Mute / Unmute
</button>

</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
